[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback. Netlify checks the publish directory before applying these
# rules, so only real routes reach index.html.
#
# The asset exclusion keeps a missing .js/.css from returning index.html with
# a 200. Without it a stale chunk request answers with HTML and the browser
# fails with a confusing MIME error instead of a clean 404.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
